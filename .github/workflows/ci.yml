name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run the test suite
        run: python -m pytest -q

  docs:
    name: Documentation build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements-docs.txt

      - name: Build every PDF, the deck and the Markdown sources
        run: python docs/build_docs.py --out docs/build

      - name: Validate the generated set
        run: python docs/check_docs.py docs/build

      - name: Upload the PDFs
        uses: actions/upload-artifact@v4
        with:
          name: project-documentation
          path: |
            docs/build/*.pdf
            docs/build/*.pptx
          if-no-files-found: error

  container:
    name: Container demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Check the checkout honours the line-ending rules
        run: |
          git check-attr eol -- docker/entrypoint.sh | grep -q 'eol: lf'
          if grep -rIl $'\r' docker/*.sh; then
            echo "::error::Shell scripts must be committed with LF endings"
            exit 1
          fi

      - name: Build the image and start the stack
        run: docker compose up -d --build

      - name: Wait for the dashboard healthcheck
        run: |
          for attempt in $(seq 1 60); do
            id=$(docker compose ps -q dashboard 2>/dev/null || true)
            status="missing"
            if [ -n "$id" ]; then
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$id" 2>/dev/null || echo unknown)
            fi
            echo "dashboard: $status (attempt $attempt)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          docker compose logs --no-color
          exit 1

      - name: Run the simulated drill inside the container
        run: |
          docker compose cp ./simulate_ransomware.py engine:/app/simulate_ransomware.py
          docker compose exec -T engine python /app/simulate_ransomware.py --yes

      - name: Verify the packaged demo end to end
        run: python3 tests/ci_container_smoke.py

      - name: Show the containers when a step fails
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Remove the stack and its volume
        if: always()
        run: docker compose down -v
